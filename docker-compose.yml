# ──────────────────────────────────────────────────────────────
# Exe ERP — Docker Compose (production)
# Connects to external exe-db (PostgreSQL) and redis
# ──────────────────────────────────────────────────────────────

services:
  # ── First-boot configurator (runs once, creates site) ──────
  exe-erp-configurator:
    # Production: pull the published, immutable image only — never build from
    # local context. Pinned to the multi-arch index digest (resolved 2026-06-30)
    # so the tag cannot be silently re-pushed under us.
    image: ghcr.io/askexe/exe-erp:v0.3.6
    # Hardening: drop all Linux capabilities and block privilege escalation.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["echo", "Site configured successfully"]
    environment:
      DB_HOST: exe-db
      DB_PORT: "5432"
      DB_TYPE: postgres
      DB_NAME: exe_erp
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong password (12+ chars, mixed case, numbers, special chars)}
      ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD:?ERP_ADMIN_PASSWORD is required — set a strong password (12+ chars, mixed case, numbers, special chars)}
      REDIS_CACHE: redis://redis:6379/3
      REDIS_QUEUE: redis://redis:6379/4
      REDIS_SOCKETIO: redis://redis:6379/5
      SITE_NAME: ${SITE_NAME:?SITE_NAME is required — set your ERP site domain (e.g. erp.acme.com). No localhost/AskExe default for production.}
      EXE_ERP_ADMIN_TOKEN: ${EXE_ERP_ADMIN_TOKEN:-}
      EXE_ADMIN_TOKEN: ${EXE_ADMIN_TOKEN:-}
      GOTRUE_URL: ${GOTRUE_URL:-}
      # Public auth URL for browser SSO redirects (https://auth.<domain>).
      # Distinct from GOTRUE_URL (internal service address).
      GOTRUE_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL:-}
      GOTRUE_ADMIN_TOKEN: ${GOTRUE_ADMIN_TOKEN:-}
      # Unified permissions (bug 842ede7c): org id that activates managed/
      # centralized role enforcement. Without it enforcement is inert (roles
      # stay Frappe-local) or every user is denied+disabled once claims stamp.
      # entrypoint.sh writes this into site_config.json.
      EXE_ORG_ID: ${EXE_ORG_ID:-}
      # SSO auto-provisioning allowlist (bug b6f1cd7d). CSV of email domains
      # authorized to auto-provision on first SSO login, e.g. "acme.com,partner.org".
      # Without this (or GOTRUE_ALLOW_ALL_DOMAINS) first login is fail-closed.
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      # Single-tenant opt-in: trust every GoTrue user's domain (alternative to
      # the allowlist above). Set to "true" only when every GoTrue user is trusted.
      GOTRUE_ALLOW_ALL_DOMAINS: ${GOTRUE_ALLOW_ALL_DOMAINS:-}
      # SSO callback CSRF (bug adf77179). Defaults TRUE in code (secure): the
      # auth domain MUST echo the `state` nonce. Leave unset to keep the secure
      # default; set to "false" ONLY as a mid-rollout escape hatch.
      GOTRUE_REQUIRE_CALLBACK_STATE: ${GOTRUE_REQUIRE_CALLBACK_STATE:-}
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
    networks:
      - exe-net
    restart: "no"

  # ── Gunicorn backend ───────────────────────────────────────
  exe-erp:
    # Production: pull the published, immutable image only — never build from
    # local context. Pinned to the multi-arch index digest (resolved 2026-06-30)
    # so the tag cannot be silently re-pushed under us.
    image: ghcr.io/askexe/exe-erp:v0.3.6
    # Hardening: drop all Linux capabilities and block privilege escalation.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command:
      - gunicorn
      - --bind=0.0.0.0:8000
      - --workers=4
      - --timeout=120
      - --graceful-timeout=30
      - --worker-tmp-dir=/dev/shm
      - frappe.app:application
    environment:
      DB_HOST: exe-db
      DB_PORT: "5432"
      DB_TYPE: postgres
      DB_NAME: exe_erp
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong password (12+ chars, mixed case, numbers, special chars)}
      REDIS_CACHE: redis://redis:6379/3
      REDIS_QUEUE: redis://redis:6379/4
      REDIS_SOCKETIO: redis://redis:6379/5
      SITE_NAME: ${SITE_NAME:?SITE_NAME is required — set your ERP site domain (e.g. erp.acme.com). No localhost/AskExe default for production.}
      EXE_ERP_ADMIN_TOKEN: ${EXE_ERP_ADMIN_TOKEN:-}
      EXE_ADMIN_TOKEN: ${EXE_ADMIN_TOKEN:-}
      GOTRUE_URL: ${GOTRUE_URL:-}
      # Public auth URL for browser SSO redirects (https://auth.<domain>).
      # Read at request time by login.py:get_exe_auth_url() as a fallback to
      # site_config; distinct from GOTRUE_URL (internal service address).
      GOTRUE_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL:-}
      GOTRUE_ADMIN_TOKEN: ${GOTRUE_ADMIN_TOKEN:-}
      # Unified permissions (bug 842ede7c): env fallback for api.py:_configured_org_id
      # (site_config `exe_org_id` is authoritative; this covers the runtime read
      # on the request-serving process if the site_config write is ever missing).
      EXE_ORG_ID: ${EXE_ORG_ID:-}
      # Raw-events landing pad (bug 12f4c334). When unset the exe_bridge fails
      # closed and visibly disables raw.raw_events emission instead of silently
      # guessing credentials. Set to the exedb bridge DSN to enable forwarding.
      EXE_BRIDGE_DATABASE_URL: ${EXE_BRIDGE_DATABASE_URL:-}
    expose:
      - "8000"
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
    networks:
      - exe-net
    depends_on:
      exe-erp-configurator:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/method/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Socket.io for realtime events ──────────────────────────
  exe-erp-websocket:
    # Production: pull the published, immutable image only — never build from
    # local context. Pinned to the multi-arch index digest (resolved 2026-06-30)
    # so the tag cannot be silently re-pushed under us.
    image: ghcr.io/askexe/exe-erp:v0.3.6
    # Hardening: drop all Linux capabilities and block privilege escalation.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: []
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      REDIS_SOCKETIO: redis://redis:6379/5
      SITE_NAME: ${SITE_NAME:?SITE_NAME is required — set your ERP site domain (e.g. erp.acme.com). No localhost/AskExe default for production.}
    ports:
      - "127.0.0.1:9069:9000"
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
    networks:
      - exe-net
    depends_on:
      exe-erp:
        condition: service_healthy
    restart: unless-stopped
    # Realtime socket.io server listens on 9000. A TCP connect proves the
    # node process is up and accepting connections (bug 790794e8 follow-up:
    # the websocket service previously crash-looped with no visible signal).
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"net\").connect(9000,\"127.0.0.1\").on(\"connect\",()=>process.exit(0)).on(\"error\",()=>process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── RQ worker for background jobs ──────────────────────────
  exe-erp-queue:
    # Production: pull the published, immutable image only — never build from
    # local context. Pinned to the multi-arch index digest (resolved 2026-06-30)
    # so the tag cannot be silently re-pushed under us.
    image: ghcr.io/askexe/exe-erp:v0.3.6
    # Hardening: drop all Linux capabilities and block privilege escalation.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: []
    command:
      - bench
      - worker
      - --queue=default,short,long
    environment:
      DB_HOST: exe-db
      DB_PORT: "5432"
      DB_TYPE: postgres
      DB_NAME: exe_erp
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong password (12+ chars, mixed case, numbers, special chars)}
      REDIS_CACHE: redis://redis:6379/3
      REDIS_QUEUE: redis://redis:6379/4
      REDIS_SOCKETIO: redis://redis:6379/5
      SITE_NAME: ${SITE_NAME:?SITE_NAME is required — set your ERP site domain (e.g. erp.acme.com). No localhost/AskExe default for production.}
      # Raw-events landing pad (bug 12f4c334) — background jobs/scheduled tasks
      # emit trace events; bridge fails closed + visible when this is unset.
      EXE_BRIDGE_DATABASE_URL: ${EXE_BRIDGE_DATABASE_URL:-}
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
    networks:
      - exe-net
    depends_on:
      exe-erp:
        condition: service_healthy
    restart: unless-stopped
    # The RQ worker has no listening port; liveness = the worker process
    # is still running. Without this the container can wedge silently and
    # background jobs stop processing with no signal (bug 81a9b8ad).
    #
    # THREE GENERATIONS OF THIS PROBE WERE BROKEN. Read before touching it:
    #   gen 1: pgrep -f 'bench worker' — pgrep is NOT in the slim Frappe base
    #          (exit 127) => permanent false-unhealthy.
    #   gen 2: ps -ef | grep -q '[r]q worker' — shipped as the FIX for gen 1
    #          (bug c8fb434f) while asserting "ps + grep are present"; ps is
    #          ALSO absent. This aborted >=2 production stack deploys (0.9.33,
    #          0.9.34) on exe-erp-queue after 180s each, auto-rolling back.
    #          exe-erp itself was healthy every time — the image was never at fault.
    #   gen 3: a python /proc/1/cmdline probe matching b'bench worker'
    #          (bug ed19883e, exe-os PR #580) — "verified" only against a
    #          SYNTHETIC PID1 argv, never a real container. `bench` execs away at
    #          startup, so real PID 1 is
    #            .../env/bin/python -m frappe.utils.bench_helper frappe worker --queue=...
    #          and the literal "bench worker" never appears => exit 1 (measured
    #          against genuinely-healthy production containers, 2026-08-14).
    #   gen 4 (this): match what PID 1 actually is — 'frappe worker'. Verified
    #          exit 0 against those same live containers.
    # The `tr` is load-bearing: /proc/1/cmdline is NUL-separated, so a bare
    # `grep -q 'frappe worker' /proc/1/cmdline` returns 1 (measured).
    #
    # RULE: a healthcheck must not name a binary the image does not ship, and
    # must not match a literal PID 1 never contains. Only sh, tr and grep are
    # used here; pidof is the only process tool this image ships.
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'frappe worker'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frappe scheduler (cron-like background tasks) ──────────
  exe-erp-scheduler:
    # Production: pull the published, immutable image only — never build from
    # local context. Pinned to the multi-arch index digest (resolved 2026-06-30)
    # so the tag cannot be silently re-pushed under us.
    image: ghcr.io/askexe/exe-erp:v0.3.6
    # Hardening: drop all Linux capabilities and block privilege escalation.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: []
    command:
      - bench
      - schedule
    environment:
      DB_HOST: exe-db
      DB_PORT: "5432"
      DB_TYPE: postgres
      DB_NAME: exe_erp
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong password (12+ chars, mixed case, numbers, special chars)}
      REDIS_CACHE: redis://redis:6379/3
      REDIS_QUEUE: redis://redis:6379/4
      REDIS_SOCKETIO: redis://redis:6379/5
      SITE_NAME: ${SITE_NAME:?SITE_NAME is required — set your ERP site domain (e.g. erp.acme.com). No localhost/AskExe default for production.}
      # Raw-events landing pad (bug 12f4c334) — background jobs/scheduled tasks
      # emit trace events; bridge fails closed + visible when this is unset.
      EXE_BRIDGE_DATABASE_URL: ${EXE_BRIDGE_DATABASE_URL:-}
    volumes:
      - erp-sites:/home/frappe/frappe-bench/sites
    networks:
      - exe-net
    depends_on:
      exe-erp:
        condition: service_healthy
    restart: unless-stopped
    # The scheduler has no listening port; liveness = the schedule process
    # is still running. Without this a stalled scheduler stops dispatching
    # cron jobs (enqueued_calls, daily/weekly tasks) silently (bug 81a9b8ad).
    #
    # Same three broken generations as exe-erp-queue above — see that block for
    # the full history. In short:
    #   gen 1: pgrep -f 'bench schedule' — pgrep is NOT in the slim Frappe base
    #          (exit 127) => permanent false-unhealthy.
    #   gen 2: ps -ef | grep — ps is ALSO absent (bug c8fb434f); this aborted
    #          >=2 production stack deploys (0.9.33, 0.9.34) with auto-rollback.
    #   gen 3: python /proc/1/cmdline matching b'bench schedule' (bug ed19883e,
    #          exe-os PR #580) — `bench` execs away, so real PID 1 is
    #            .../env/bin/python -m frappe.utils.bench_helper frappe schedule
    #          and "bench schedule" never appears => exit 1 (measured on live,
    #          genuinely-healthy production containers, 2026-08-14).
    #   gen 4 (this): match 'frappe schedule', what PID 1 actually is. Verified
    #          exit 0 against those same live containers.
    # The `tr` is load-bearing: /proc/1/cmdline is NUL-separated, so a bare
    # `grep -q 'frappe schedule' /proc/1/cmdline` returns 1 (measured).
    #
    # RULE: a healthcheck must not name a binary the image does not ship, and
    # must not match a literal PID 1 never contains. Only sh, tr and grep are
    # used here; pidof is the only process tool this image ships.
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'frappe schedule'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -- Nginx reverse proxy ------------------------------------------------
  exe-erp-nginx:
    image: ghcr.io/askexe/exe-erp:v0.3.6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: []
    command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/asset-healthcheck.sh:/usr/local/bin/asset-healthcheck.sh:ro
    ports:
      - "127.0.0.1:8069:8080"
    networks:
      - exe-net
    depends_on:
      exe-erp:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck asserts that the CSS/JS asset bundles the page references
    # actually resolve — not merely that ping answers 200. A 200 page with
    # 404ing bundles is a broken deploy and must be RED (bug f6552d32).
    # timeout 15s: page fetch plus a few bundle HEADs; start_period 90s:
    # let the backend's asset refresh + cache flush settle before gating.
    healthcheck:
      test: ["CMD-SHELL", "sh /usr/local/bin/asset-healthcheck.sh http://localhost:8080 /login"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

# ── Volumes ──────────────────────────────────────────────────
volumes:
  erp-sites:
    name: exe-erp-sites

# ── Networks ─────────────────────────────────────────────────
# Connect to existing exe-os network (exe-db + redis already running)
networks:
  exe-net:
    external: true
    name: exe-net
