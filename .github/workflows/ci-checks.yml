# ──────────────────────────────────────────────────────────────
# Exe ERP — CI checks. Portable gates run on the dedicated mac-fast
# runner for PR latency; Linux/Docker-only checks run on default-branch
# pushes.
#
# Covers (bug c2b86c39 — CI too shallow):
#   1. compose config validation
#   2. stack release contract validation
#   3. Python lint (ruff) of Exe-owned fork code
#   4. Python syntax compile of all Exe-owned modules
#   5. Exe-owned Python UNIT TESTS actually execute (bug 483cc712 —
#      compileall only byte-compiles; it never runs a test, so every
#      test in this fork, including the PR #54 SSO/deploy-manifest
#      contract guards, was permanently and silently green)
#   6. migration / patches.txt smoke (broken patch refs fail closed)
#   7. dependency security audit (pip-audit + yarn audit, fork deps)
#   8. real production Docker build (no push) — exercises
#      `bench build --production` + the websocket import smoke check
#   9. secret scan (gitleaks CLI — working tree + git history)
#  10. container/deps + IaC scan (trivy fs — vuln/misconfig/secret)
#
# CI SCOPE — what is NOT covered here, stated plainly:
# The inherited upstream suites (erpnext/, hrms/, frappe/) subclass
# `frappe.tests.utils.FrappeTestCase` and require a bootstrapped bench
# site with live MariaDB + Redis. This job has none of those, so it does
# NOT run them; doing so needs a `bench init` + `bench new-site` service
# stack on every PR, which is separate, larger work. Step 5 runs the
# Exe-owned, deliberately frappe-free tests, and fails closed if it
# collects zero tests or if a named contract class stops being collected
# — a vacuous "0 tests, exit 0" pass is treated as a failure.
#
# Least-privilege: read-only, no packages/contents write. All
# third-party actions pinned to a full commit SHA.
# ──────────────────────────────────────────────────────────────
name: CI checks

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to check out and validate
        required: false
        type: string

permissions:
  contents: read

# Cancel superseded runs (bug 03faf797).
#
# THE PREFIX IS LOAD-BEARING (bug b7496cb1). In a reusable workflow the `github`
# context is the CALLER's, so `github.workflow` here resolves to the calling
# workflow's name — not "CI checks". Without the prefix this group is
# byte-identical to the caller's own group, and `cancel-in-progress` makes the
# callee cancel its own caller the moment the `gate` job starts. That is what
# killed every workflow_dispatch of "Release stack image" (run 31088517462
# failed 3s after creation with `release-image` skipped).
#
# pr-checks.yml avoids the collision the same way, with a `pr-checks-` prefix.
# Any new caller must likewise carry a distinct prefix.
concurrency:
  group: ci-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate + lint + migration smoke
    runs-on: [self-hosted, macOS, ARM64, mac-fast]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate docker-compose.yml
        run: |
          # docker-compose interpolates required vars (SITE_NAME, etc.) and
          # fails config validation if they are unset. Seed throwaway values
          # from .env.example directly so the check validates compose
          # interpolation + syntax deterministically without writing .env
          # into a persistent self-hosted runner checkout.
          docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Validate Dockerfile is parseable
        # BOUNDED ON PURPOSE (bug 3136f36b). `docker build --check` performs a
        # REGISTRY metadata fetch -- observed stalling indefinitely at
        # "#2 [internal] load metadata for docker.io/library/python:3.14-slim-bookworm".
        # It has no built-in timeout, and this repo has exactly ONE mac-fast
        # runner, so an unbounded stall holds the only slot and starves every
        # queued job behind it: run 33319026352 sat in_progress for 2h19m while
        # the gitleaks job never started, leaving PR #65 permanently "pending".
        # The mac runner has neither `timeout` nor `gtimeout`, so bound by hand.
        # Semantics are unchanged from `... || test -f Dockerfile`: this step was
        # already advisory, so a timeout degrades to the presence check rather
        # than failing the build.
        timeout-minutes: 5
        shell: bash
        run: |
          set -uo pipefail
          docker build --check . & check_pid=$!
          ( sleep 120; kill -9 "$check_pid" 2>/dev/null ) & watchdog_pid=$!
          wait "$check_pid"; rc=$?
          kill "$watchdog_pid" 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "::warning::docker build --check exited $rc (137 = killed by the 120s watchdog, typically a stalled registry metadata fetch); falling back to Dockerfile presence check"
          fi
          test "$rc" -eq 0 || test -f Dockerfile

      - name: Validate stack release contract
        shell: bash
        run: |
          python3 -m json.tool stack.release.json >/dev/null
          python3 - <<'PY'
          import json
          rel = json.load(open('stack.release.json'))
          assert rel.get('version'), 'version required'
          components = rel.get('components', {})
          assert 'erp' in components, 'erp component required in components map'
          erp_image = components['erp']
          assert ':v' + rel['version'] in erp_image, f'erp image must use stack release tag: {erp_image}'
          health = rel.get('stackParticipation', {}).get('health', [])
          assert len(health) > 0, 'health checks required'
          print('stack release contract OK:', rel['version'])
          PY

      # Catch a malformed/stale manifest on the PR, not at tag-cut time. Runs the
      # gate's own negative-case suite first so a gate that has stopped refusing
      # is itself caught. Only the PRE phase is meaningful here — the digest is an
      # OUTPUT of the release build (bug cc8feeee) and cannot exist yet.
      - name: Stack pin gate (self-tests + pre phase)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-stack-pins.py --self-test
          python3 .github/scripts/verify-stack-pins.py --phase pre

      # Reconcile the DEPLOY manifest (docker-compose.yml) against the RELEASE
      # manifest (stack.release.json). Without this the two files can pin
      # different images and stay silently green — the exact failure that kept
      # erp.askexe.com/login serving the pre-fix image while source, test and
      # manifest were all correct (bugs 129a0495 / 96e6b8b6). Required check.
      - name: Stack pin gate (compose <-> stack.release.json reconciliation)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-stack-pins.py --phase compose

      - name: Set up Python tooling
        shell: bash
        run: |
          set -euo pipefail
          # actions/setup-python cannot manage Python or pip cache on the
          # self-hosted mac-fast runner; use runner-provided python3 instead.
          PYTHON3="$(command -v python3)"
          if [ "${RUNNER_OS:-}" = "macOS" ] && [ -x /opt/homebrew/bin/python3 ]; then
            PYTHON3=/opt/homebrew/bin/python3
          elif [ "${RUNNER_OS:-}" = "macOS" ] && [ -x /usr/local/bin/python3 ]; then
            PYTHON3=/usr/local/bin/python3
          fi
          VENV_DIR="${RUNNER_TEMP:-/tmp}/exe-erp-validate-venv"
          "$PYTHON3" -m venv "$VENV_DIR"
          . "$VENV_DIR/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "ruff==0.14.10" "pip-audit~=2.7" "tomli>=1.1; python_version < '3.11'"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - name: Install Python audit build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev build-essential python3-dev
          else
            echo "::notice::apt/sudo unavailable; relying on runner-provided build prerequisites"
          fi

      - name: Ruff lint (Exe fork code)
        run: |
          # Lint the Exe-owned fork modules with the repo ruff config.
          # Inherited upstream code is excluded via pyproject; we hard-fail
          # only on the code this fork actually ships.
          python -m ruff check \
            apps/erpnext/erpnext/exe_auth \
            apps/erpnext/erpnext/exe_bridge \
            apps/erpnext/erpnext/exe_monitor \
            apps/erpnext/erpnext/exe_setup

      - name: Python compile (all Exe modules)
        run: |
          python3 -m compileall -q \
            apps/erpnext/erpnext/exe_auth \
            apps/erpnext/erpnext/exe_bridge \
            apps/erpnext/erpnext/exe_monitor \
            apps/erpnext/erpnext/exe_setup


      - name: Entrypoint admin-password regression (bug 593fe59f)
        run: bash scripts/entrypoint-admin-password.test.sh

      - name: Asset volume refresh regression (bug f6552d32 / 3938ac3d)
        run: bash scripts/asset-volume-refresh.test.sh

      - name: Asset healthcheck script lints (bug f6552d32)
        run: sh -n scripts/asset-healthcheck.sh

      - name: Workflow gate integrity (bugs b7496cb1, 98fbb1a0)
        run: python3 scripts/workflow-gate-integrity.test.py

      # Runs EVERY Exe-owned, frappe-free unit test (bug 483cc712).
      #
      # This replaces the previous hand-maintained allowlist of one-file
      # `python3 <path>` steps. That pattern ran the SSO cookie contract
      # (bug 3938ac3d) but silently omitted two other Exe-owned test
      # modules -- `exe_auth/test_exe_perms.py` (56 tests) and
      # `exe_monitor/test_error_reporter.py` (3 tests) -- which had never
      # executed in CI at all. `ruff` and `compileall` above do not help:
      # compileall byte-compiles a file, it never runs a test.
      #
      # The runner is manifest-driven and fails closed: zero collected
      # tests, a missing test module, or a missing named contract class
      # is an ERROR, not a vacuous pass.
      - name: Python unit tests (Exe-owned, frappe-free)
        run: python3 .github/scripts/ci_python_tests.py

      - name: Migration / patches smoke
        run: python3 .github/scripts/ci_migration_smoke.py

      - name: Dependency security audit (pip)
        shell: bash
        run: |
          # Audit the fork's declared Python dependencies. Non-blocking on
          # transitive-only advisories that have no fix line, but fails on
          # any fixable vulnerability in a directly-declared dependency.
          python3 - <<'PY' > /tmp/pip_reqs.txt
          import re
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          data = tomllib.load(open('pyproject.toml', 'rb'))
          deps = data.get('project', {}).get('dependencies', [])
          # pip-audit resolves this file via a `pip install --dry-run`
          # pass, which requires every dependency to be installable
          # (fetchable wheel or buildable sdist) on the runner.
          #   - git+ pins: pip-audit can't resolve VCS deps offline.
          #   - mysqlclient: no manylinux wheel is resolved for this
          #     runner's Python/arch, so pip falls back to building from
          #     source, which needs system MariaDB/MySQL client headers
          #     (pkg-config, libmariadb-dev) that this minimal CI image
          #     doesn't have. That single unresolvable package aborts the
          #     whole audit before anything is actually checked. It has no
          #     known advisories as of writing (checked via osv.dev); it's
          #     still covered by Dependabot and manual review.
          SKIP_NAMES = {'mysqlclient'}
          for d in deps:
              if 'git+' in d:
                  continue
              name = re.split(r'[=<>~!\[; ]', d, maxsplit=1)[0].strip()
              if name in SKIP_NAMES:
                  continue
              print(d)
          PY
          audit_backoffs=(5 10 20)
          audit_status=0
          for attempt in 1 2 3 4; do
            rm -f /tmp/pip-audit.json /tmp/pip-audit.stderr
            set +e
            python -m pip_audit --requirement /tmp/pip_reqs.txt --strict --format json --output /tmp/pip-audit.json 2> /tmp/pip-audit.stderr
            audit_status=$?
            set -e
            if python3 - <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path('/tmp/pip-audit.json')
          if not report.exists() or not report.read_text().strip():
              sys.exit(1)
          try:
              json.loads(report.read_text())
          except json.JSONDecodeError:
              sys.exit(1)
          sys.exit(0)
          PY
            then
              echo "pip-audit produced a report on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              break
            fi
            backoff="${audit_backoffs[$((attempt - 1))]}"
            echo "::warning::pip-audit did not produce a parseable report on attempt $attempt; retrying in ${backoff}s"
            sleep "$backoff"
          done
          AUDIT_STATUS=$audit_status python3 - <<'PY'
          import json, os, pathlib, sys
          audit_status = int(os.environ.get('AUDIT_STATUS', '0'))
          report = pathlib.Path('/tmp/pip-audit.json')
          if not report.exists() or not report.read_text().strip():
              if audit_status:
                  print('::error::pip-audit failed before producing a report')
                  sys.exit(audit_status)
              sys.exit(0)
          data = json.loads(report.read_text())
          fixable = []
          unfixable = []
          for dep in data.get('dependencies', []):
              name = dep.get('name')
              version = dep.get('version')
              for vuln in dep.get('vulns', []):
                  fixes = vuln.get('fix_versions') or []
                  item = f"{name} {version} {vuln.get('id')}"
                  if fixes:
                      fixable.append(f"{item} (fix: {', '.join(fixes)})")
                  else:
                      unfixable.append(item)
          for item in unfixable:
              print(f"::warning::pip-audit reported no fixed version for {item}")
          if fixable:
              print('::error::pip-audit found fixable vulnerable dependencies:\n' + '\n'.join(fixable))
              sys.exit(1)
          if audit_status not in (0, 1):
              print('::error::pip-audit failed with status', audit_status)
              sys.exit(audit_status)
          print('pip-audit found no fixable vulnerabilities in declared dependencies')
          PY

      - name: Dependency security audit (yarn)
        shell: bash
        run: |
          # Audit the JS dependency tree for high/critical advisories.
          #
          # The repo ships Yarn *Classic* (v1) lockfiles (the production
          # Dockerfile pins yarn@1.22.22). Self-hosted runners may default
          # to Yarn Berry (v2+), whose audit command and lockfile format
          # differ — Berry's `yarn npm audit` can't even read the classic
          # lockfile and errors out, which previously broke this gate.
          #
          # `npx --yes yarn@1.22.22` is NOT sufficient to pin it. npx prefers a
          # `yarn` binary that already exists on PATH, and on the mac-fast
          # runner that binary is the **corepack shim** shipped with Node, which
          # resolves to Yarn Berry 4.13.0. The version spec is silently ignored
          # and Berry runs instead, dying on the classic lockfile with
          #   Internal Error: exe-erp@workspace:.: This package doesn't seem to
          #   be present in your lockfile; run "yarn install" to update it
          # on stdout — so no `auditSummary` line is ever emitted and the gate
          # fails closed on every attempt. (Reproduced on the runner host.)
          # Retrying cannot help: it is a version-resolution bug, not flake.
          #
          # Install Yarn Classic into a throwaway prefix and invoke its bin
          # DIRECTLY, bypassing PATH and corepack entirely, then assert the
          # version before trusting a single line of output. Classic audit needs
          # no prior `yarn install` (it resolves from yarn.lock alone). Run it
          # from an isolated copy of the root package.json + yarn.lock: on this
          # macOS runner Yarn Classic rewrites classic lockfile `resolved` URLs
          # even during audit, and persistent self-hosted checkouts must stay
          # clean.
          #
          # Robustness (advisories are a moving target — new ones publish
          # daily against transitive, non-our-code packages):
          #   * Auto-skip UNFIXABLE advisories (no patched version exists) —
          #     the Yarn-Classic equivalent of `--ignore-unfixed` — so a new
          #     transitive advisory with no upstream fix can't re-break this
          #     required gate.
          #   * FAIL on every other advisory — a fixable advisory in a dep we
          #     actually control must be bumped, not ignored.
          #
          # The two historical transitive advisories in the
          # @vue/component-compiler -> postcss-modules-sync -> generic-names
          # -> loader-utils -> json5 chain are now FIXED outright via
          # `resolutions` in package.json (loader-utils ^2.0.3, json5 ^2.2.2 —
          # verified they still build `bench build --production`), so they no
          # longer appear here. They stay in ALLOWED_ADVISORY_IDS purely as a
          # documented safety net in case a resolution is ever dropped:
          #       1094088  loader-utils prototype pollution (GHSA-76p3-8jx3-jpfq)
          #       1096543  json5 prototype pollution        (GHSA-9c47-m6qq-7p4h)
          #
          # Fail closed: the audit MUST emit its summary line; if it doesn't
          # (wrong yarn, network error, empty output) the step retries a
          # bounded number of times, then fails rather than silently passing.
          workspace="${GITHUB_WORKSPACE:-$PWD}"
          test -f "$workspace/package.json"
          test -f "$workspace/yarn.lock"
          audit_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/exe-erp-yarn-audit.XXXXXX")"
          cp "$workspace/package.json" "$workspace/yarn.lock" "$audit_dir"/
          yarn1_prefix="$(mktemp -d "${RUNNER_TEMP:-/tmp}/exe-erp-yarn1.XXXXXX")"
          npm install --no-save --no-audit --no-fund --silent \
            --prefix "$yarn1_prefix" yarn@1.22.22
          yarn1="$yarn1_prefix/node_modules/.bin/yarn"
          test -x "$yarn1"
          yarn1_version="$("$yarn1" --version)"
          if [ "$yarn1_version" != "1.22.22" ]; then
            echo "::error::expected Yarn Classic 1.22.22 for the audit, got \
          $yarn1_version — refusing to audit with the wrong yarn"
            exit 1
          fi
          echo "yarn audit binary: $yarn1 (v$yarn1_version)"
          audit_backoffs=(5 10 20)
          for attempt in 1 2 3 4; do
            rm -f /tmp/yarn_audit.jsonl /tmp/yarn_audit.stderr
            (
              cd "$audit_dir"
              "$yarn1" audit --level high --json
            ) > /tmp/yarn_audit.jsonl 2> /tmp/yarn_audit.stderr || true
            if python3 - <<'PY'
          import json
          import sys

          with open("/tmp/yarn_audit.jsonl") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      obj = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if obj.get("type") == "auditSummary":
                      sys.exit(0)
          sys.exit(1)
          PY
            then
              echo "yarn audit produced a summary on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              break
            fi
            backoff="${audit_backoffs[$((attempt - 1))]}"
            echo "::warning::yarn audit produced no summary on attempt $attempt; retrying in ${backoff}s"
            sleep "$backoff"
          done
          YARN_AUDIT_STDERR=/tmp/yarn_audit.stderr python3 <<'PY'
          import json
          import os
          import pathlib
          import sys

          ALLOWED_ADVISORY_IDS = {"1094088", "1096543"}

          def is_unfixable(advisory):
              # npm/yarn convention: patched range "<0.0.0" (or empty) means
              # no fixed version exists anywhere -> nothing to bump to.
              patched = (advisory.get("patched_versions") or "").strip()
              return patched in ("", "<0.0.0")

          blocking = []
          saw_summary = False
          with open("/tmp/yarn_audit.jsonl") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      obj = json.loads(line)
                  except json.JSONDecodeError:
                      # Non-JSON noise (e.g. a wrong-yarn usage banner) —
                      # ignore the line, but never treat it as "clean".
                      continue
                  kind = obj.get("type")
                  if kind == "auditSummary":
                      saw_summary = True
                      continue
                  if kind != "auditAdvisory":
                      continue
                  advisory = obj["data"]["advisory"]
                  if str(advisory["id"]) in ALLOWED_ADVISORY_IDS:
                      continue
                  if is_unfixable(advisory):
                      print(
                          f"::notice::yarn audit: ignoring unfixable advisory "
                          f"{advisory['id']} in {advisory['module_name']} "
                          f"(no patched version available)"
                      )
                      continue
                  blocking.append(advisory)

          if not saw_summary:
              stderr_path = pathlib.Path(os.environ["YARN_AUDIT_STDERR"])
              stderr = stderr_path.read_text(encoding="utf-8", errors="replace")
              if stderr.strip():
                  print("::group::yarn audit stderr")
                  print(stderr[-4000:])
                  print("::endgroup::")
              # The wrong-yarn failure mode writes its diagnostic to STDOUT, not
              # stderr, so a stderr-only dump shows an empty group and hides the
              # cause. Always show what the audit actually printed.
              stdout = pathlib.Path("/tmp/yarn_audit.jsonl").read_text(
                  encoding="utf-8", errors="replace"
              )
              if stdout.strip():
                  print("::group::yarn audit stdout (first 4000 chars)")
                  print(stdout[:4000])
                  print("::endgroup::")
              print(
                  "::error::yarn audit did not complete (no summary line) — "
                  "failing closed"
              )
              sys.exit(1)

          if blocking:
              for advisory in blocking:
                  print(
                      f"::error::yarn audit: {advisory['module_name']} — "
                      f"{advisory['title']} ({advisory['url']})"
                  )
              sys.exit(1)

          print(
              "yarn audit clean (>=high, unfixable advisories ignored, "
              f"{len(ALLOWED_ADVISORY_IDS)} pre-triaged advisories excluded)"
          )
          PY

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: [self-hosted, macOS, ARM64, mac-fast]
    timeout-minutes: 45
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        shell: bash
        run: |
          # Run the gitleaks CLI directly (no gitleaks-action) so the scan
          # carries no org-license requirement. Pin the release and verify
          # the tarball checksum before trusting the binary.
          set -euo pipefail
          GL_VERSION=8.30.1
          case "${RUNNER_OS}_${RUNNER_ARCH}" in
            macOS_ARM64) ASSET_OS_ARCH="darwin_arm64" ;;
            Linux_X64) ASSET_OS_ARCH="linux_x64" ;;
            *)
              echo "::error::unsupported gitleaks runner platform: ${RUNNER_OS}_${RUNNER_ARCH}"
              exit 1
              ;;
          esac
          GL_DIR="${RUNNER_TEMP:-/tmp}/exe-erp-gitleaks"
          mkdir -p "$GL_DIR"
          cd "$GL_DIR"
          TARBALL="gitleaks_${GL_VERSION}_${ASSET_OS_ARCH}.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -fsSL -o "$TARBALL" "$BASE/$TARBALL"
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -fsSL -o gitleaks_checksums.txt "$BASE/gitleaks_${GL_VERSION}_checksums.txt"
          python3 - "$TARBALL" gitleaks_checksums.txt <<'PY'
          import hashlib
          import pathlib
          import sys

          tarball = pathlib.Path(sys.argv[1])
          checksums = pathlib.Path(sys.argv[2])
          expected = None
          for line in checksums.read_text(encoding="utf-8").splitlines():
              parts = line.split()
              if len(parts) >= 2 and parts[1] == tarball.name:
                  expected = parts[0]
                  break
          if not expected:
              print(f"checksum not found for {tarball.name}", file=sys.stderr)
              sys.exit(1)
          actual = hashlib.sha256(tarball.read_bytes()).hexdigest()
          if actual != expected:
              print(f"checksum mismatch for {tarball.name}", file=sys.stderr)
              sys.exit(1)
          PY
          tar -xzf "$TARBALL" gitleaks
          chmod +x gitleaks
          echo "$GL_DIR" >> "$GITHUB_PATH"
          PATH="$GL_DIR:$PATH"
          gitleaks version

      - name: Run gitleaks (fail on any finding)
        shell: bash
        run: |
          # Scan the full working tree AND git history. Any committed secret
          # fails the build closed.
          gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
          gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1

  # NO `if:` GUARD ON THIS JOB OR docker-build BELOW (bug 98fbb1a0).
  #
  # Both used to carry `if: github.event_name == 'push' && github.ref ==
  # 'refs/heads/main'`. In a reusable workflow the `github` context belongs to
  # the CALLER, so that condition was false on every call site except a direct
  # push to main:
  #   - pull_request via pr-checks.yml  -> SKIPPED (GitHub counts a skipped
  #     required context as SATISFIED, so these read green without evaluating)
  #   - release tag / workflow_dispatch via release-stack-image.yml's `gate`
  #     -> SKIPPED, even though that job's whole purpose is to run "the FULL
  #     deep CI suite ... real production Docker build" against the release
  #     SHA. The release gate was not building the production image at all.
  # A gate that cannot fail is not a gate. Keep these unconditional.
  trivy-scan:
    name: Container/deps scan (trivy)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Trivy filesystem scan (deps + IaC/Dockerfile misconfig + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  docker-build:
    name: Production Docker build (no push)
    # Kept self-hosted (FR 17efa619): full production image build exercises
    # `bench build --production` + websocket import smoke — heavy, and the
    # GHA layer cache is warmest on the persistent host. Release publish
    # (release-stack-image.yml) also stays self-hosted for GHCR secrets.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image (amd64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
