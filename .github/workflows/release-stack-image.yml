name: Release stack image

on:
  push:
    tags:
      - 'v*.*.*'
      - 'stack-v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ── Fail-closed CI gate (bug 0a5c57fe) ───────────────────────
  # Run the FULL deep CI suite (lint, compile, migration smoke,
  # dependency audit, real production Docker build) against the
  # EXACT commit the release tag points at. If any check fails,
  # this job fails and `release-image` (needs: gate) never runs —
  # so no image can be published without green CI on the release
  # SHA. Same suite that gates every PR (ci-checks.yml).
  gate:
    name: CI gate (green required)
    uses: ./.github/workflows/ci-checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  release-image:
    name: Build + push stack image
    needs: gate
    # FOUNDER DECISION 2026-09-05: erp image releases stay on NATIVE x64
    # runners (the dedicated VPS lane). Deliberately NOT mac-local — the one
    # sanctioned VPS-lane exception.
    #
    # `vps-x64` (bug b56fa021) is what actually ENFORCES that decision. The
    # label set above used to be [self-hosted, linux, x64], which does NOT
    # identify the VPS: mac-vm-erp-1, an aarch64 Lima VM, also advertises `X64`
    # so that x64-labelled PR checks can land on it. Release runs therefore
    # could and did schedule onto ARM hardware, where the amd64 build emulates.
    # `vps-x64` is carried by exactly one runner — the dedicated x86_64 VPS —
    # so this lane is deterministic
    # instead of depending on which runner happened to be free.
    runs-on: [self-hosted, linux, x64, vps-x64]
    # BOUNDED (bug 3136f36b): self-hosted job, no platform default; observed
    # 49-60 min over the last 10 runs -> 90 min caps a wedged build/push at 1.5x worst.
    timeout-minutes: 90
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      # FIRST STEP, deliberately — before checkout and before every gate, so a
      # wrong-arch scheduling is refused in seconds rather than after minutes of
      # setup. Labels are assertions a runner makes about itself, and mac-vm-erp-1
      # demonstrably lies about `X64`. If this job ever lands on ARM hardware
      # anyway, `platforms: linux/amd64` would silently emulate and reintroduce
      # exactly this bug — so refuse in seconds rather than stall for an hour.
      # This is the check that makes "native" a fact rather than a hope.
      - name: Assert this runner is native x86_64 (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          if [ "$actual" != "x86_64" ]; then
            echo "::error::Release build scheduled onto a $actual runner (${RUNNER_NAME:-unknown})."
            echo "::error::Building linux/amd64 here would emulate under QEMU — the failure mode of bug b56fa021. Refusing."
            exit 1
          fi
          echo "✓ $actual runner (${RUNNER_NAME:-unknown}) is native for linux/amd64."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # Prove the pin gate still REFUSES before trusting it to approve anything.
      # A guard nobody has watched refuse is not a guard — these 17 cases assert
      # the specific failures (tag-only, wrong digest, foreign registry, one
      # tag-only component among four, ...) rather than assuming them.
      - name: Stack pin gate self-tests (negative cases)
        shell: bash
        run: python3 .github/scripts/verify-stack-pins.py --self-test

      # Reconcile docker-compose.yml against stack.release.json on the committed
      # tree BEFORE building. If the deploy manifest lags the release manifest,
      # the host would serve old code after the fix merges (bugs 129a0495 /
      # 96e6b8b6). Run pre-build only: the post-build step re-pins the release
      # manifest to the freshly built digest in place, and docker-compose.yml is
      # not committed back in the same run, so a post-build reconciliation would
      # compare against an ephemeral, uncommitted digest.
      - name: Stack pin gate (compose <-> stack.release.json reconciliation)
        shell: bash
        run: python3 .github/scripts/verify-stack-pins.py --phase compose

      - name: Validate stack release contract
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool stack.release.json >/dev/null

          # PRE phase: what a human may legally commit. All four components must
          # name this repo at :v<version>; a digest may already be present (a
          # re-pin, or the pin a previous run wrote back) but is NOT required —
          # a new build's digest cannot exist before the build (bug cc8feeee).
          python3 .github/scripts/verify-stack-pins.py --phase pre

          python3 - <<'PY2' >> "$GITHUB_OUTPUT"
          import json
          rel = json.load(open('stack.release.json'))
          health = rel.get('stackParticipation', {}).get('health', [])
          assert len(health) > 0, 'health checks required'
          version = rel['version']
          # The push tag is DERIVED from version, never read verbatim out of
          # components. components.erp may carry an @sha256 pin, and `tag@digest`
          # is not a pushable reference — feeding it to build-push-action as a tag
          # is what made a digest-pinned manifest unbuildable before this change.
          print('stack_version=' + version)
          print('image=ghcr.io/askexe/exe-erp:v' + version)
          PY2

      # ── Git-tag provenance gate (bug 2c9bf186) ──────────────────
      # THE INCIDENT. ghcr.io/askexe/exe-erp:v0.3.2, :v0.3.3 and :v0.3.4 were
      # published on 2026-08-31 and v0.3.4 was deployed to production — while
      # `git tag -l "v0.3.*"` in this repo listed only v0.3.0 and v0.3.1. They
      # were not hand-pushed: they came out of THIS workflow, via its
      # `workflow_dispatch` trigger, run three times against `main`.
      #
      # WHY THAT PRODUCES AN UNTAGGED RELEASE. The pushed image tag is DERIVED
      # from stack.release.json's `version` field (see the step above), not from
      # the git ref. On a tag push those agree by construction. On a
      # workflow_dispatch against a branch, `version` is whatever the last PR
      # bumped it to and there is no tag anywhere — so the run publishes a
      # release-named image for a commit nobody ever tagged. Every downstream
      # guard was satisfied: the tag-immutability check passed (the tag was
      # genuinely new), CI was green, the digest was captured, the labels were
      # correct. The one thing nothing checked was whether the version being
      # released existed in git. The result is bytes in production that cannot
      # be traced back to a reviewed, tagged commit.
      #
      # THE FIX. Require the git tag to exist AND to point at the commit being
      # built, for BOTH triggers. That makes workflow_dispatch behave exactly
      # like a tag push instead of being a second, unguarded release path — the
      # tag is created first, by a human, through review, and the build follows
      # it. Deliberately NO break-glass variable: an override here is an
      # override on "is this code released at all", which is the whole question.
      - name: Assert this version exists as a git tag at this commit (fail closed)
        env:
          STACK_VERSION: ${{ steps.release.outputs.stack_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${STACK_VERSION}"

          # The API is the authority, not the runner's local refs: actions/checkout
          # fetches a single commit with no tags, so `git tag -l` here is empty for
          # every release and would fail even a correct one.
          # `gh --jq` uses gh's own built-in jq, so this needs no jq binary on
          # the runner — the rest of this workflow reaches for python3 for the
          # same reason, and the self-hosted release runner is not guaranteed
          # to have jq installed.
          if ! resp="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha, .object.type' 2>/dev/null)"; then
            echo "::error::stack.release.json declares version ${STACK_VERSION}, but git tag ${tag} does not exist in ${GITHUB_REPOSITORY}."
            echo "::error::Refusing to publish ghcr.io/askexe/exe-erp:${tag} — it would be a release-named image for a commit nobody tagged (bug 2c9bf186)."
            echo "::error::Push the tag at the reviewed commit first: git tag ${tag} <sha> && git push origin ${tag}. That alone triggers this workflow."
            exit 1
          fi

          sha="$(printf '%s\n' "$resp" | sed -n '1p')"
          type="$(printf '%s\n' "$resp" | sed -n '2p')"
          # Annotated tags point at a tag object; dereference to the commit.
          if [ "$type" = "tag" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
          fi

          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::git tag ${tag} exists but could not be resolved to a commit. Unverifiable provenance fails closed."
            exit 1
          fi

          if [ "$sha" != "${GITHUB_SHA}" ]; then
            echo "::error::git tag ${tag} points at ${sha}, but this run is building ${GITHUB_SHA}."
            echo "::error::Publishing would put bytes built from an untagged commit behind a released tag name (bug 2c9bf186). Refusing."
            exit 1
          fi

          echo "✓ ${tag} exists in ${GITHUB_REPOSITORY} and points at ${GITHUB_SHA}."

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      # ── Tag immutability guard (bug 2fe79166) ───────────────────
      # ghcr.io/askexe/exe-erp:v0.2.0-final8 was pushed over at least
      # three times, so the tag pointed at three different builds over
      # its lifetime — anything pinning it is not reproducible. The
      # workflow used to push the version tag unconditionally; this
      # guard fails the release BEFORE anything is pushed if the tag
      # already exists in the registry. It fails closed: only an
      # authoritative 404 counts as "tag absent".
      # Break-glass: set repo variable EXE_ALLOW_TAG_OVERWRITE=1 for a
      # deliberate re-push (rare); state why in the release PR.
      - name: Assert release tag is unpublished (fail closed)
        env:
          # GHCR_TOKEN comes from the job-level env above; re-declaring the
          # secret expression here would just be a second place to drift.
          EXE_ALLOW_TAG_OVERWRITE: ${{ vars.EXE_ALLOW_TAG_OVERWRITE }}
        run: |
          python3 scripts/assert-release-tag-unpublished.py --repository askexe/exe-erp --tag "v${{ steps.release.outputs.stack_version }}"

      # Bug 5f2fb4fa: docker/setup-buildx-action creates a fresh named
      # `buildx_buildkit_builder-<uuid>` container per run but does not clean
      # up the previous run's builder container when that run is cancelled
      # mid-setup. On 2026-08-31 this stalled three consecutive release
      # builds on the self-hosted ERP release runner — each one hung for 2+ minutes inside "Set
      # up Docker Buildx" itself, before any build layer ran, because two
      # orphaned builder containers from earlier cancelled runs were still
      # "Up" and not registered in `docker buildx ls`. Manual `docker rm` on
      # both immediately unblocked the next run.
      #
      # Bug df3264de: that fix's predicate matched EVERY repo's
      # auto-generated "buildx_buildkit_builder-*" container, because none
      # of them carry any repo identity. Once exe-erp, exe-crm and exe-os
      # runners moved onto one shared Docker host, this step started
      # SIGKILLing other repos' in-flight builders. Scoped out in
      # scripts/cleanup-orphaned-buildx-builders.sh: this job's builder now
      # gets an explicit, workflow-exclusive name (set on the "Set up Docker
      # Buildx" step below) and the cleanup only ever matches that exact
      # name -- a positive "I only created this" check, not a narrowed
      # guess. Anything whose ownership isn't provably ours is left alone.
      - name: Clean up orphaned buildx builder containers
        run: scripts/cleanup-orphaned-buildx-builders.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # Must match BUILDX_BUILDER_NAME's default in
          # scripts/cleanup-orphaned-buildx-builders.sh -- that script only
          # ever removes a container named after THIS value, so the name is
          # the ownership proof. Stable (not per-run): this job's runner
          # label runs one job at a time, so no two attempts of this same
          # job ever hold this name concurrently (bug df3264de).
          name: erp-release-buildx

      # ── Measure tree cleanliness, fail closed (bug b46bc7fd) ─────────────
      # org.exe.tree_clean is a provenance claim: it certifies the published
      # image corresponds EXACTLY to the checked-out commit, with no
      # uncommitted or untracked files baked in by `COPY . .`. A label that
      # cannot fail certifies nothing, so this MEASURES the tree with
      # `git status --porcelain` -- the same method exe-os's
      # scripts/bake-version.sh uses, and the same reasoning: untracked,
      # non-ignored files count as dirty because they end up inside the image
      # too, and a `git status` that cannot even run must NOT be read as
      # clean. Unlike a label, this is fail-closed: a dirty tree stops the
      # release here, before Docker Buildx builds a single layer, rather than
      # publishing an image with a false clean claim.
      - name: Measure tree cleanliness (fail closed)
        id: tree_clean
        shell: bash
        run: |
          set -euo pipefail
          if tree_status="$(git status --porcelain 2>/dev/null)"; then
            if [ -z "$tree_status" ]; then
              clean="true"
            else
              clean="false"
            fi
          else
            # git status could not be determined -- refuse to assert clean.
            clean="false"
          fi
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          if [ "$clean" != "true" ]; then
            echo "::error::Working tree is dirty at build time -- refusing to publish an image labelled org.exe.tree_clean=true over an unproven claim (bug b46bc7fd)."
            echo "::group::git status --porcelain"
            echo "$tree_status"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ Working tree is clean (git status --porcelain reported nothing)."

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # amd64 ONLY, built natively on this x86_64 host — no emulation.
          #
          # WHY (bug b56fa021). This used to be `linux/amd64,linux/arm64`, which
          # means one of the two legs is ALWAYS emulated under QEMU on any
          # hardware we own, and both emulation directions are now failing:
          #   - arm64-under-QEMU on the x64 VPS: the dependency install cannot
          #     open a connection — "Failed to connect to github.com port 443
          #     after 132519 ms" — while the NATIVE amd64 leg in the very same
          #     run, on the same host, cloned the same repos in ~3s.
          #   - amd64-under-QEMU on the aarch64 VM: `bench init ... uv venv env
          #     --seed --python python3.14` dies in ~4s. Same signature PR #93
          #     already fixed in the PR-check lane by going native.
          # Emulation is the common factor. It is NOT proven to be the root
          # cause — v0.3.8 (run 33590838337) did build its emulated arm64 leg
          # successfully, and Dockerfile/pyproject.toml are byte-identical
          # between v0.3.8 and v0.3.11 — but it is the variable that separates
          # every passing leg from every failing one right now.
          #
          # Dropping arm64 is a DELIBERATE, temporary narrowing: the customer
          # stack runs on an x64 VPS, so amd64 is what actually ships, and this
          # unblocks the deployment today. Consequence to be aware of: the
          # published tag is single-arch until the arm64 leg returns, so an
          # `docker pull` on Apple Silicon will no longer resolve natively.
          # Native arm64 + a manifest list is the immediate follow-up.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}
            ghcr.io/askexe/exe-erp:sha-${{ github.sha }}
          # org.exe.* provenance labels let a running container be traced back to
          # a commit even when a tag was reused (bug 2fe79166). They must stay
          # OUTSIDE the block scalar below -- every line inside `labels: |` is a
          # literal label, so a `#` there becomes a garbage label, not a comment.
          # org.exe.tree_clean is DERIVED from the "Measure tree cleanliness"
          # step above, never a literal (bug b46bc7fd) -- that step already
          # failed the job closed if the tree was dirty, so this always reads
          # "true" here, but it reads the MEASUREMENT rather than asserting a
          # constant that would have carried an unproven claim regardless.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.stack_version }}
            org.exe.git_sha=${{ github.sha }}
            org.exe.repo=${{ github.repository }}
            org.exe.git_ref=${{ github.ref }}
            org.exe.tree_clean=${{ steps.tree_clean.outputs.clean }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Assert what was actually published, rather than just that SOMETHING
      # resolves. The old check was `docker manifest inspect >/dev/null`, which
      # passes for any image that exists — it would not have noticed the wrong
      # architecture. `imagetools inspect` reports platforms directly.
      - name: Verify published image is linux/amd64 (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.release.outputs.image }}"
          docker buildx imagetools inspect "${{ steps.release.outputs.image }}" --raw \
            > "${RUNNER_TEMP}/exe-erp-manifest.json"
          python3 - <<'PY'
          import json, os
          m = json.load(open(os.environ['RUNNER_TEMP'] + '/exe-erp-manifest.json'))
          # buildx pushes a manifest list even for a single platform (the image
          # plus its provenance attestation, which carries platform
          # unknown/unknown and is not a real target).
          plats = sorted(
              f"{p.get('os')}/{p.get('architecture')}"
              for d in m.get('manifests', [])
              if (p := d.get('platform')) and p.get('architecture') != 'unknown')
          if not plats:
              raise SystemExit('::error::Could not determine any platform for the published image.')
          if 'linux/amd64' not in plats:
              raise SystemExit(f'::error::Published image does not provide linux/amd64. Found: {plats}')
          print('✓ published image provides:', ', '.join(plats))
          PY
          echo "Published and verified ${{ steps.release.outputs.image }}"

      # ── Digest capture (the step whose absence caused this bug) ─────────────
      # v0.3.0 shipped with all four components on the MUTABLE tag :v0.3.0
      # because this workflow published tags and never recorded the immutable
      # @sha256 digest. A mutable tag is what poisoned exe-erp's own
      # v0.2.0-final8 (pinned 2d55a7c3…, later resolving to 15bb6020…) and
      # exe-gateway's v0.9.28. Capture the digest build-push-action emitted and
      # write it into every component so the manifest describes exact bytes.
      #
      # Fail closed if no digest was produced — never record an unpinned value.
      - name: Capture image digest into stack manifest (fail closed)
        id: pin
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_DIGEST:-}" ]; then
            echo "::error::build-push-action produced no digest. Refusing to record an unpinned image."
            exit 1
          fi
          case "$IMAGE_DIGEST" in
            sha256:*) : ;;
            *) echo "::error::Unexpected digest format '$IMAGE_DIGEST' (expected sha256:<64 hex>)."; exit 1 ;;
          esac
          python3 - <<'PY'
          import json, os, re, collections
          digest = os.environ['IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit(f'Refusing to record malformed digest: {digest}')
          path = 'stack.release.json'
          rel = json.loads(open(path, encoding='utf-8').read(),
                           object_pairs_hook=collections.OrderedDict)
          # All four roles (erp, websocket, queue, scheduler) run ONE image, so
          # one digest pins all four. Strip any pre-existing digest first so a
          # re-pinned manifest converges instead of accumulating.
          for name, ref in rel['components'].items():
              rel['components'][name] = f"{ref.split('@')[0]}@{digest}"
          open(path, 'w', encoding='utf-8').write(
              json.dumps(rel, indent=2, ensure_ascii=False) + '\n')
          for name, ref in rel['components'].items():
              print(f'  {name}: {ref}')
          PY

      # POST phase, fail-closed: EVERY component must now carry @sha256:<64 hex>
      # and every one must equal the digest this run actually built and pushed.
      # This is what refuses a tag-only manifest — and it is also what catches
      # the capture step above silently no-opping or being deleted later.
      - name: Enforce digest pins (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-stack-pins.py \
            --phase post \
            --built-digest "${{ steps.build.outputs.digest }}"

      # The digest-pinned manifest is the release's authoritative output. It is
      # what the exe-os stack manifest pins from — the digest is an OUTPUT of a
      # release, never an input to it (bug cc8feeee).
      - name: Upload digest-pinned stack manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-release-pinned
          path: stack.release.json
          if-no-files-found: error

      - name: Report pinned digest
        shell: bash
        run: |
          {
            echo "## Stack image published"
            echo ""
            echo "| field | value |"
            echo "|-------|-------|"
            echo "| release tag | \`${{ steps.release.outputs.image }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| pinned ref | \`ghcr.io/askexe/exe-erp@${{ steps.build.outputs.digest }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo ""
            echo "All four components (erp, erp-websocket, erp-queue, erp-scheduler)"
            echo "are pinned to this digest in the \`stack-release-pinned\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
