name: Release stack image

on:
  push:
    tags:
      - 'v*.*.*'
      - 'stack-v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ── Fail-closed CI gate (bug 0a5c57fe) ───────────────────────
  # Run the FULL deep CI suite (lint, compile, migration smoke,
  # dependency audit, real production Docker build) against the
  # EXACT commit the release tag points at. If any check fails,
  # this job fails and `release-image` (needs: gate) never runs —
  # so no image can be published without green CI on the release
  # SHA. Same suite that gates every PR (ci-checks.yml).
  gate:
    name: CI gate (green required)
    uses: ./.github/workflows/ci-checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}

  release-image:
    name: Build + push stack image
    needs: gate
    runs-on: [self-hosted, linux, x64]
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # Prove the pin gate still REFUSES before trusting it to approve anything.
      # A guard nobody has watched refuse is not a guard — these 17 cases assert
      # the specific failures (tag-only, wrong digest, foreign registry, one
      # tag-only component among four, ...) rather than assuming them.
      - name: Stack pin gate self-tests (negative cases)
        shell: bash
        run: python3 .github/scripts/verify-stack-pins.py --self-test

      # Reconcile docker-compose.yml against stack.release.json on the committed
      # tree BEFORE building. If the deploy manifest lags the release manifest,
      # the host would serve old code after the fix merges (bugs 129a0495 /
      # 96e6b8b6). Run pre-build only: the post-build step re-pins the release
      # manifest to the freshly built digest in place, and docker-compose.yml is
      # not committed back in the same run, so a post-build reconciliation would
      # compare against an ephemeral, uncommitted digest.
      - name: Stack pin gate (compose <-> stack.release.json reconciliation)
        shell: bash
        run: python3 .github/scripts/verify-stack-pins.py --phase compose

      - name: Validate stack release contract
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool stack.release.json >/dev/null

          # PRE phase: what a human may legally commit. All four components must
          # name this repo at :v<version>; a digest may already be present (a
          # re-pin, or the pin a previous run wrote back) but is NOT required —
          # a new build's digest cannot exist before the build (bug cc8feeee).
          python3 .github/scripts/verify-stack-pins.py --phase pre

          python3 - <<'PY2' >> "$GITHUB_OUTPUT"
          import json
          rel = json.load(open('stack.release.json'))
          health = rel.get('stackParticipation', {}).get('health', [])
          assert len(health) > 0, 'health checks required'
          version = rel['version']
          # The push tag is DERIVED from version, never read verbatim out of
          # components. components.erp may carry an @sha256 pin, and `tag@digest`
          # is not a pushable reference — feeding it to build-push-action as a tag
          # is what made a digest-pinned manifest unbuildable before this change.
          print('stack_version=' + version)
          print('image=ghcr.io/askexe/exe-erp:v' + version)
          PY2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      # ── Tag immutability guard (bug 2fe79166) ───────────────────
      # ghcr.io/askexe/exe-erp:v0.2.0-final8 was pushed over at least
      # three times, so the tag pointed at three different builds over
      # its lifetime — anything pinning it is not reproducible. The
      # workflow used to push the version tag unconditionally; this
      # guard fails the release BEFORE anything is pushed if the tag
      # already exists in the registry. It fails closed: only an
      # authoritative 404 counts as "tag absent".
      # Break-glass: set repo variable EXE_ALLOW_TAG_OVERWRITE=1 for a
      # deliberate re-push (rare); state why in the release PR.
      - name: Assert release tag is unpublished (fail closed)
        env:
          # GHCR_TOKEN comes from the job-level env above; re-declaring the
          # secret expression here would just be a second place to drift.
          EXE_ALLOW_TAG_OVERWRITE: ${{ vars.EXE_ALLOW_TAG_OVERWRITE }}
        run: |
          python3 scripts/assert-release-tag-unpublished.py --repository askexe/exe-erp --tag "v${{ steps.release.outputs.stack_version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}
            ghcr.io/askexe/exe-erp:sha-${{ github.sha }}
          # org.exe.* provenance labels let a running container be traced back to
          # a commit even when a tag was reused (bug 2fe79166). They must stay
          # OUTSIDE the block scalar below -- every line inside `labels: |` is a
          # literal label, so a `#` there becomes a garbage label, not a comment.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.stack_version }}
            org.exe.git_sha=${{ github.sha }}
            org.exe.repo=${{ github.repository }}
            org.exe.git_ref=${{ github.ref }}
            org.exe.tree_clean=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        run: |
          docker manifest inspect "${{ steps.release.outputs.image }}" >/dev/null
          echo "Published and verified ${{ steps.release.outputs.image }}"

      # ── Digest capture (the step whose absence caused this bug) ─────────────
      # v0.3.0 shipped with all four components on the MUTABLE tag :v0.3.0
      # because this workflow published tags and never recorded the immutable
      # @sha256 digest. A mutable tag is what poisoned exe-erp's own
      # v0.2.0-final8 (pinned 2d55a7c3…, later resolving to 15bb6020…) and
      # exe-gateway's v0.9.28. Capture the digest build-push-action emitted and
      # write it into every component so the manifest describes exact bytes.
      #
      # Fail closed if no digest was produced — never record an unpinned value.
      - name: Capture image digest into stack manifest (fail closed)
        id: pin
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_DIGEST:-}" ]; then
            echo "::error::build-push-action produced no digest. Refusing to record an unpinned image."
            exit 1
          fi
          case "$IMAGE_DIGEST" in
            sha256:*) : ;;
            *) echo "::error::Unexpected digest format '$IMAGE_DIGEST' (expected sha256:<64 hex>)."; exit 1 ;;
          esac
          python3 - <<'PY'
          import json, os, re, collections
          digest = os.environ['IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit(f'Refusing to record malformed digest: {digest}')
          path = 'stack.release.json'
          rel = json.loads(open(path, encoding='utf-8').read(),
                           object_pairs_hook=collections.OrderedDict)
          # All four roles (erp, websocket, queue, scheduler) run ONE image, so
          # one digest pins all four. Strip any pre-existing digest first so a
          # re-pinned manifest converges instead of accumulating.
          for name, ref in rel['components'].items():
              rel['components'][name] = f"{ref.split('@')[0]}@{digest}"
          open(path, 'w', encoding='utf-8').write(
              json.dumps(rel, indent=2, ensure_ascii=False) + '\n')
          for name, ref in rel['components'].items():
              print(f'  {name}: {ref}')
          PY

      # POST phase, fail-closed: EVERY component must now carry @sha256:<64 hex>
      # and every one must equal the digest this run actually built and pushed.
      # This is what refuses a tag-only manifest — and it is also what catches
      # the capture step above silently no-opping or being deleted later.
      - name: Enforce digest pins (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-stack-pins.py \
            --phase post \
            --built-digest "${{ steps.build.outputs.digest }}"

      # The digest-pinned manifest is the release's authoritative output. It is
      # what the exe-os stack manifest pins from — the digest is an OUTPUT of a
      # release, never an input to it (bug cc8feeee).
      - name: Upload digest-pinned stack manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-release-pinned
          path: stack.release.json
          if-no-files-found: error

      - name: Report pinned digest
        shell: bash
        run: |
          {
            echo "## Stack image published"
            echo ""
            echo "| field | value |"
            echo "|-------|-------|"
            echo "| release tag | \`${{ steps.release.outputs.image }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| pinned ref | \`ghcr.io/askexe/exe-erp@${{ steps.build.outputs.digest }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo ""
            echo "All four components (erp, erp-websocket, erp-queue, erp-scheduler)"
            echo "are pinned to this digest in the \`stack-release-pinned\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
